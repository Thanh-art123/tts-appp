<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chapter_title }} - Đọc Truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f5;
            color: #18181b;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        /* THANH CÔNG CỤ CỐ ĐỊNH TRÊN ĐẦU (CÓ HOA VĂN NHẸ) */
        .sticky-toolbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid #047857;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 12px 25px;
            width: 100%;
        }

        /* KHUNG ĐỌC TRUYỆN TO HƠN, CÁCH LỀ THOÁNG ĐÃNG */
        .reader-container-box {
            width: 90%;
            max-width: 1150px; /* Khung rộng hơn, lề hai bên thoáng */
            margin: 30px auto;
            background: #ffffff;
            border: 2px solid #d1d5db;
            border-radius: 14px;
            padding: 40px 60px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        /* HOA VĂN CỔ PHONG NHẸ NHÀNG Ở GÓC KHUNG */
        .reader-container-box::before, .reader-container-box::after {
            content: "❖ ❖ ❖";
            display: block;
            text-align: center;
            color: #047857;
            font-size: 14px;
            letter-spacing: 8px;
            opacity: 0.6;
            margin-bottom: 15px;
        }
        .reader-container-box::after {
            margin-top: 30px;
            margin-bottom: 0;
        }

        .story-content-text {
            font-size: 17px;
            line-height: 1.9;
            color: #27272a;
            text-align: justify;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .tool-btn {
            background: #f4f4f5;
            border: 1px solid #d4d4d8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #3f3f46;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #e4e4e7;
            color: #047857;
        }

        .chapter-anchor {
            scroll-margin-top: 90px;
        }
    </style>
</head>
<body>

    <!-- THANH CÔNG CỤ CỐ ĐỊNH -->
    <div class="sticky-toolbar">
        <div style="max-width: 1250px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="/tang-kinh-cac" style="font-weight: bold; color: #047857; text-decoration: none; font-size: 13px;">
                    ⬅ Tàng Kinh Các
                </a>
            </div>

            <!-- Menu cuộn nhanh đến chương -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 12px; color: #71717a; font-weight: bold;">Chuyển Chương:</span>
                <select id="chapter-jump-select" onchange="jumpToChapter(this.value)" class="bg-white border border-zinc-300 rounded px-3 py-1.5 text-xs font-bold text-emerald-800 outline-none max-w-[280px]">
                    <option value="">Đang quét danh sách chương...</option>
                </select>
            </div>

            <!-- BẢNG ĐIỀU CHỈNH PHỐNG CHỮ & CỠ CHỮ -->
            <div style="display: flex; align-items: center; gap: 15px;">
                <!-- Phông chữ -->
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 12px; color: #71717a; font-weight: bold;">Phông:</span>
                    <select onchange="changeFontFamily(this.value)" class="bg-white border border-zinc-300 rounded px-2 py-1 text-xs font-semibold text-zinc-800 outline-none">
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="'Georgia', serif">Georgia</option>
                    </select>
                </div>

                <!-- Cỡ chữ -->
                <div style="display: flex; align-items: center; gap: 5px;">
                    <span style="font-size: 12px; color: #71717a; font-weight: bold;">Cỡ chữ:</span>
                    <button onclick="changeFontSize(-1)" class="tool-btn">-</button>
                    <span id="font-size-num" style="font-size: 12px; font-weight: bold; width: 30px; text-align: center;">17px</span>
                    <button onclick="changeFontSize(1)" class="tool-btn">+</button>
                </div>
            </div>
        </div>
    </div>

    <center>
        <div class="reader-container-box" id="main-reader-box" style="text-align: left;">
            
            <div style="text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 16px; margin-bottom: 25px;">
                <h1 style="font-size: 22px; font-weight: bold; color: #065f46; margin: 0 0 6px 0;">
                    {{ chapter_title }}
                </h1>
                <p style="font-size: 12px; color: #a1a1aa; margin: 0;">Tông Môn Đọc Truyện • Chế độ toàn văn cao cấp</p>
            </div>

            <!-- DỮ LIỆU GỐC (ẨN) -->
            <div id="raw-hidden-content" style="display: none;">{{ chapter_content | safe }}</div>
            
            <!-- NỘI DUNG CHÍNH -->
            <div id="story-content-body" class="story-content-text">
                Đang xử lý và làm sạch văn bản...
            </div>

            <!-- CHÂN TRANG ĐIỀU HƯỚNG -->
            <div style="border-top: 1px dashed #cbd5e1; margin-top: 40px; padding-top: 25px; text-align: center;">
                <a href="/tang-kinh-cac" style="background: #047857; color: #fff; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: bold; text-decoration: none; display: inline-block;">📋 Trở Về Tàng Kinh Các</a>
                <p style="font-size: 12px; color: #a1a1aa; margin-top: 15px;">--- Hết Toàn Bộ Kho Tàng ---</p>
            </div>

        </div>
    </center>

    <script>
        let currentFontSize = 17;

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 36) currentFontSize = 36;
            
            document.getElementById('font-size-num').innerText = currentFontSize + 'px';
            document.getElementById('story-content-body').style.fontSize = currentFontSize + 'px';
        }

        function changeFontFamily(font) {
            document.getElementById('story-content-body').style.fontFamily = font;
        }

        window.addEventListener('DOMContentLoaded', () => {
            let rawHTML = document.getElementById('raw-hidden-content').innerHTML;
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawHTML;
            
            tempDiv.querySelectorAll('style, script').forEach(el => el.remove());
            let cleanText = tempDiv.textContent || tempDiv.innerText || "";

            if (cleanText.includes("{") && cleanText.includes("}")) {
                let lastBraceIdx = cleanText.lastIndexOf("}");
                if (lastBraceIdx !== -1 && lastBraceIdx < 1500) {
                    cleanText = cleanText.substring(lastBraceIdx + 1).trim();
                }
            }

            let matches = [...cleanText.matchAll(/Chương\s+\d+/gi)];
            if (matches.length > 5) {
                let contentStartIndex = 0;
                for (let i = 0; i < matches.length - 1; i++) {
                    let distance = matches[i + 1].index - matches[i].index;
                    if (distance > 500) {
                        contentStartIndex = matches[i].index;
                        break;
                    }
                }
                if (contentStartIndex > 0) {
                    cleanText = cleanText.substring(contentStartIndex);
                }
            }

            cleanText = cleanText.replace(/([^\n])(Chương\s+\d+[:\s])/gi, '$1\n\n$2');

            const container = document.getElementById('story-content-body');
            container.innerText = "";

            let lines = cleanText.split('\n');
            let selectEl = document.getElementById('chapter-jump-select');
            selectEl.innerHTML = '<option value="">-- Chọn chương để cuộn đến --</option>';

            let chapterCount = 0;

            lines.forEach((line) => {
                let p = document.createElement('p');
                p.style.margin = "10px 0";
                p.innerText = line;

                if (/^Chương\s+\d+/i.test(line.trim())) {
                    chapterCount++;
                    let targetId = `chap-pos-${chapterCount}`;
                    p.id = targetId;
                    p.className = "chapter-anchor";
                    p.style.fontWeight = "bold";
                    p.style.color = "#047857";
                    p.style.marginTop = "30px";

                    let opt = document.createElement('option');
                    opt.value = targetId;
                    opt.innerText = line.trim().length > 40 ? line.trim().substring(0, 40) + '...' : line.trim();
                    selectEl.appendChild(opt);
                }

                container.appendChild(p);
            });

            if (chapterCount === 0) {
                selectEl.innerHTML = '<option value="">Toàn văn (Không tìm thấy tiêu đề chương)</option>';
            }
        });

        function jumpToChapter(targetId) {
            if (!targetId) return;
            let targetElement = document.getElementById(targetId);
            if (targetElement) {
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
    </script>
</body>
</html>
