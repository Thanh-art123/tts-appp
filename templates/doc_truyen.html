<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chapter_title }} - Đọc Truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f5;
            color: #18181b;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 10px;
        }

        /* Khung đọc truyện chính canh giữa */
        .reader-container-box {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 30px 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: max-width 0.3s ease;
        }

        .story-content-text {
            font-size: 16px;
            line-height: 1.85;
            color: #27272a;
            text-align: justify;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .tool-btn {
            background: #f4f4f5;
            border: 1px solid #d4d4d8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #3f3f46;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #e4e4e7;
            color: #047857;
        }

        .action-btn {
            background: #047857;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            background: #065f46;
        }
    </style>
</head>
<body>

    <center>
        <!-- KHUNG ĐỌC TRUYỆN CHÍNH (BAO GỒM THANH CÔNG CỤ TRÊN ĐẦU CHƯƠNG) -->
        <div class="reader-container-box" id="main-reader-box" style="text-align: left;">
            
            <!-- THANH CÔNG CỤ ĐA NĂNG ĐẶT NGAY TRÊN ĐẦU CHƯƠNG -->
            <div style="background: #fafafa; border: 1px solid #e4e4e7; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;">
                <!-- Dòng 1: Điều hướng & Cài đặt hiển thị -->
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;">
                    <a href="/tang-kinh-cac" style="font-weight: bold; color: #047857; text-decoration: none; font-size: 13px;">
                        ⬅ Trở Về Tàng Kinh Các
                    </a>

                    <!-- Phông chữ -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 12px; color: #71717a; font-weight: bold;">Phông:</span>
                        <select onchange="changeFontFamily(this.value)" class="bg-white border border-zinc-300 rounded px-2 py-1 text-xs font-semibold text-zinc-800 outline-none">
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="'Times New Roman', serif">Times New Roman</option>
                            <option value="'Georgia', serif">Georgia</option>
                        </select>
                    </div>

                    <!-- Cỡ chữ -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 12px; color: #71717a; font-weight: bold;">Cỡ:</span>
                        <button onclick="changeFontSize(-1)" class="tool-btn">-</button>
                        <span id="font-size-num" style="font-size: 12px; font-weight: bold; width: 30px; text-align: center;">16px</span>
                        <button onclick="changeFontSize(1)" class="tool-btn">+</button>
                    </div>

                    <!-- Độ rộng khung -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 12px; color: #71717a; font-weight: bold;">Độ rộng:</span>
                        <button onclick="changeContainerWidth('700px')" class="tool-btn">Hẹp</button>
                        <button onclick="changeContainerWidth('850px')" class="tool-btn">Vừa</button>
                        <button onclick="changeContainerWidth('1050px')" class="tool-btn">Rộng</button>
                        <button onclick="changeContainerWidth('100%')" class="tool-btn">100%</button>
                    </div>
                </div>
            </div>

            <!-- TIÊU ĐỀ BỘ TRUYỆN -->
            <div style="text-align: center; border-bottom: 1px solid #e4e4e7; padding-bottom: 16px; margin-bottom: 24px;">
                <h1 style="font-size: 20px; font-weight: bold; color: #065f46; margin: 0 0 6px 0;">
                    {{ chapter_title }}
                </h1>
                <p style="font-size: 12px; color: #a1a1aa; margin: 0;">Tông Môn Đọc Truyện • Chế độ tập trung</p>
            </div>

            <!-- NỘI DUNG VĂN BẢN HIỂN THỊ ĐẦY ĐỦ 100% -->
            <div id="story-content-body" class="story-content-text">
                {{ chapter_content | safe }}
            </div>

            <!-- CHÂN TRANG ĐIỀU HƯỚNG CUỐI CHƯƠNG -->
            <div style="border-top: 1px solid #e4e4e7; margin-top: 35px; padding-top: 20px; text-align: center;">
                <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 12px;">
                    <a href="/tang-kinh-cac" class="action-btn">📋 Trở Về Tàng Kinh Các</a>
                </div>
                <p style="font-size: 12px; color: #a1a1aa; margin: 0;">--- Hết Nội Dung ---</p>
            </div>

        </div>
    </center>

    <script>
        let currentFontSize = 16;

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 32) currentFontSize = 32;
            
            document.getElementById('font-size-num').innerText = currentFontSize + 'px';
            document.getElementById('story-content-body').style.fontSize = currentFontSize + 'px';
        }

        function changeFontFamily(font) {
            document.getElementById('story-content-body').style.fontFamily = font;
        }

        function changeContainerWidth(widthStr) {
            document.getElementById('main-reader-box').style.maxWidth = widthStr;
        }

        // Đảm bảo cuộn lên đầu trang khi vừa nạp xong
        window.scrollTo(0, 0);
    </script>
</body>
</html>
