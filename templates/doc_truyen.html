<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chapter_title }} - Đọc Truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f5; /* Nền sáng trang nhã */
            color: #27272a;           /* Chữ tối màu dễ đọc */
            font-family: 'Georgia', 'Segoe UI', serif;
        }
        .reader-wrapper {
            max-width: 850px;
            margin: 40px auto;
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 50px 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4">

    <!-- Khu vực khung đọc truyện chính -->
    <div class="reader-wrapper space-y-8">
        
        <!-- Tiêu đề truyện và chương -->
        <div class="text-center space-y-2 border-b border-zinc-200 pb-6">
            <h1 class="text-xl font-bold text-emerald-700 tracking-wide uppercase">Lá Xanh - Bán Tiệt Bạch Thái</h1>
            <p class="text-sm font-semibold text-zinc-600">{{ chapter_title }}</p>
            
            <!-- Biểu tượng trang trí cổ điển -->
            <div class="flex justify-center items-center space-x-2 pt-2 text-zinc-400">
                <span class="h-[1px] w-12 bg-zinc-300"></span>
                <i class="fa-solid fa-feather text-xs"></i>
                <span class="h-[1px] w-12 bg-zinc-300"></span>
            </div>
        </div>

        <!-- Các nút điều hướng (Chương trước, Mục lục, Chương tiếp) -->
        <div class="flex justify-center items-center space-x-3">
            <button onclick="alert('Đang ở chương đầu tiên!')" class="bg-emerald-600/30 hover:bg-emerald-600/40 text-emerald-800 font-bold px-4 py-2 rounded-lg text-xs transition flex items-center space-x-1 cursor-pointer">
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
                <span>Chương trước</span>
            </button>
            <a href="/tang-kinh-cac" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-lg text-xs transition shadow flex items-center justify-center cursor-pointer" title="Trở về Mục Lục Tàng Kinh Các">
                <i class="fa-solid fa-list"></i>
            </a>
            <button onclick="alert('Đã đến chương cuối!')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition flex items-center space-x-1 shadow cursor-pointer">
                <span>Chương tiếp</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </div>

        <!-- Hoa văn trang trí ngăn cách -->
        <div class="text-center text-zinc-400 py-2">
            <i class="fa-solid fa-pagoda text-lg opacity-60"></i>
        </div>

        <!-- Nội dung văn bản chương truyện -->
        <div class="text-base text-zinc-800 leading-loose space-y-6 text-justify font-normal whitespace-pre-line">
            {{ chapter_content | safe }}
        </div>

        <!-- Chân trang đọc -->
        <div class="border-t border-zinc-200 pt-6 text-center text-xs text-zinc-500">
            <p>--- Hoàn chương ---</p>
            <a href="/tang-kinh-cac" class="inline-mt-3 text-emerald-700 hover:underline font-semibold mt-2 inline-block">
                <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại Tàng Kinh Các
            </a>
        </div>

    </div>

</body>
</html>
