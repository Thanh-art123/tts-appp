<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chapter_title }} - Đọc Truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f5;
            color: #18181b;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 10px;
        }

        .reader-container-box {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 30px 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: max-width 0.3s ease;
        }

        .story-content-text {
            font-size: 16px;
            line-height: 1.85;
            color: #27272a;
            text-align: justify;
            word-wrap: break-word;
            white-space: pre-line;
        }

        .tool-btn {
            background: #f4f4f5;
            border: 1px solid #d4d4d8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #3f3f46;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #e4e4e7;
            color: #047857;
        }

        .action-btn {
            background: #047857;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            background: #065f46;
        }
    </style>
</head>
<body>

    <center>
        <!-- KHUNG ĐỌC TRUYỆN CHÍNH -->
        <div class="reader-container-box" id="main-reader-box" style="text-align: left;">
            
            <!-- THANH CÔNG CỤ & ĐIỀU HƯỚNG CHƯƠNG -->
            <div style="background: #fafafa; border: 1px solid #e4e4e7; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;">
                
                <!-- Dòng 1: Tàng Kinh Các & Tùy chỉnh hiển thị -->
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid #f4f4f5; pb-2; margin-bottom: 10px; padding-bottom: 8px;">
                    <a href="/tang-kinh-cac" style="font-weight: bold; color: #047857; text-decoration: none; font-size: 13px;">
                        ⬅ Tàng Kinh Các
                    </a>

                    <!-- Phông chữ -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 12px; color: #71717a; font-weight: bold;">Phông:</span>
                        <select onchange="changeFontFamily(this.value)" class="bg-white border border-zinc-300 rounded px-2 py-1 text-xs font-semibold text-zinc-800 outline-none">
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="'Times New Roman', serif">Times New Roman</option>
                            <option value="'Georgia', serif">Georgia</option>
                        </select>
                    </div>

                    <!-- Cỡ chữ -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 12px; color: #71717a; font-weight: bold;">Cỡ:</span>
                        <button onclick="changeFontSize(-1)" class="tool-btn">-</button>
                        <span id="font-size-num" style="font-size: 12px; font-weight: bold; width: 30px; text-align: center;">16px</span>
                        <button onclick="changeFontSize(1)" class="tool-btn">+</button>
                    </div>

                    <!-- Độ rộng khung -->
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 12px; color: #71717a; font-weight: bold;">Độ rộng:</span>
                        <button onclick="changeContainerWidth('700px')" class="tool-btn">Hẹp</button>
                        <button onclick="changeContainerWidth('850px')" class="tool-btn">Vừa</button>
                        <button onclick="changeContainerWidth('1050px')" class="tool-btn">Rộng</button>
                        <button onclick="changeContainerWidth('100%')" class="tool-btn">100%</button>
                    </div>
                </div>

                <!-- Dòng 2: Nút Chuyển Chương / Chọn Chương -->
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;">
                    <button onclick="prevChapter()" class="tool-btn" style="background: #ecfdf5; color: #047857; border-color: #a7f3d0; padding: 6px 12px;">
                        ❮ Chương trước
                    </button>

                    <!-- Chọn chương trực tiếp qua Dropdown -->
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 12px; color: #71717a; font-weight: bold;">Chọn chương:</span>
                        <select id="chapter-select" onchange="jumpToChapter(this.value)" class="bg-white border border-zinc-300 rounded px-2 py-1 text-xs font-bold text-emerald-800 outline-none max-w-[240px]">
                            <option value="0">Đang phân tích danh sách...</option>
                        </select>
                    </div>

                    <button onclick="nextChapter()" class="action-btn">
                        Chương tiếp ❯
                    </button>
                </div>
            </div>

            <!-- TIÊU ĐỀ CHƯƠNG -->
            <div style="text-align: center; border-bottom: 1px solid #e4e4e7; padding-bottom: 16px; margin-bottom: 24px;">
                <h1 id="chapter-title-display" style="font-size: 20px; font-weight: bold; color: #065f46; margin: 0 0 6px 0;">
                    {{ chapter_title }}
                </h1>
                <p style="font-size: 12px; color: #a1a1aa; margin: 0;">Tông Môn Đọc Truyện • Chế độ tập trung</p>
            </div>

            <!-- NỘI DUNG VĂN BẢN GỐC (ĐÃ LỌC BỎ THẺ CSS RÁC) -->
            <div id="raw-hidden-content" style="display: none;">{{ chapter_content | safe }}</div>
            <div id="story-content-body" class="story-content-text">
                Đang xử lý văn bản...
            </div>

            <!-- CHÂN TRANG ĐIỀU HƯỚNG -->
            <div style="border-top: 1px solid #e4e4e7; margin-top: 35px; padding-top: 20px; text-align: center;">
                <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 12px;">
                    <button onclick="prevChapter()" class="tool-btn" style="padding: 6px 14px;">❮ Chương trước</button>
                    <a href="/tang-kinh-cac" class="action-btn">📋 Mục Lục Tàng Kinh Các</a>
                    <button onclick="nextChapter()" class="action-btn">Chương tiếp ❯</button>
                </div>
                <p style="font-size: 12px; color: #a1a1aa; margin: 0;">--- Hết Chương ---</p>
            </div>

        </div>
    </center>

    <script>
        let currentFontSize = 16;
        let parsedChapters = [];
        let currentChapterIdx = 0;

        function changeFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 32) currentFontSize = 32;
            
            document.getElementById('font-size-num').innerText = currentFontSize + 'px';
            document.getElementById('story-content-body').style.fontSize = currentFontSize + 'px';
        }

        function changeFontFamily(font) {
            document.getElementById('story-content-body').style.fontFamily = font;
        }

        function changeContainerWidth(widthStr) {
            document.getElementById('main-reader-box').style.maxWidth = widthStr;
        }

        // Làm sạch dữ liệu HTML/CSS rác và tách chương chuẩn xác
        function initChapterParser() {
            let rawHTML = document.getElementById('raw-hidden-content').innerHTML;
            
            // Loại bỏ hoàn toàn các thẻ style / css rác nếu file tải lên là HTML
            let tempDiv = document.createElement('div');
            tempDiv.innerHTML = rawHTML;
            
            // Xóa các thẻ style, script thừa
            const styles = tempDiv.querySelectorAll('style, script');
            styles.forEach(s => s.remove());

            let cleanText = tempDiv.textContent || tempDiv.innerText || "";

            // Nếu văn bản chứa các đoạn khai báo CSS dạng body{...}, tự động cắt bỏ phần rác đầu file
            if (cleanText.includes("{") && cleanText.includes("}")) {
                let lastBraceIdx = cleanText.lastIndexOf("}");
                if (lastBraceIdx !== -1 && lastBraceIdx < 1000) {
                    cleanText = cleanText.substring(lastBraceIdx + 1).trim();
                }
            }

            // Tách chương dựa theo từ khóa "Chương"
            const regex = /(?=Chương\s+\d+)/gi;
            let parts = cleanText.split(regex);

            if (parts.length > 1) {
                parsedChapters = parts.filter(p => p.trim().length > 0).map(p => {
                    const lines = p.trim().split('\n').filter(l => l.trim().length > 0);
                    return {
                        title: lines[0] || "Chương truyện",
                        content: lines.slice(1).join('\n').trim() || p
                    };
                });
            } else {
                parsedChapters = [{
                    title: "{{ chapter_title }}",
                    content: cleanText
                }];
            }

            // Đổ vào menu chọn chương
            const selectEl = document.getElementById('chapter-select');
            selectEl.innerHTML = '';
            parsedChapters.forEach((chap, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                // Giới hạn độ dài tiêu đề trong dropdown cho gọn gàng
                opt.innerText = chap.title.length > 40 ? chap.title.substring(0, 40) + '...' : chap.title;
                selectEl.appendChild(opt);
            });

            renderChapter(0);
        }

        function renderChapter(index) {
            if (index < 0 || index >= parsedChapters.length) return;
            currentChapterIdx = index;

            const chap = parsedChapters[index];
            document.getElementById('chapter-title-display').innerText = chap.title;
            document.getElementById('story-content-body').innerText = chap.content;
            document.getElementById('chapter-select').value = index;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevChapter() {
            if (currentChapterIdx > 0) {
                renderChapter(currentChapterIdx - 1);
            } else {
                alert("Đạo hữu đang ở chương đầu tiên!");
            }
        }

        function nextChapter() {
            if (currentChapterIdx < parsedChapters.length - 1) {
                renderChapter(currentChapterIdx + 1);
            } else {
                alert("Đã đến chương cuối cùng!");
            }
        }

        function jumpToChapter(idx) {
            renderChapter(parseInt(idx));
        }

        document.addEventListener('DOMContentLoaded', initChapterParser);
    </script>
</body>
</html>
