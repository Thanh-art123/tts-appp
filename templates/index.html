{% extends "base.html" %}
{% block title %}Nghe Giảng Kinh - Tông Môn Tu Luyện{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 relative space-y-6">
    <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/40 pb-3 flex items-center space-x-2">
        <i class="fa-solid fa-scroll text-amber-500"></i>
        <span>Giảng Kinh Điện - Chọn Đa Dạng Giọng Đọc Tu Tiên</span>
    </h2>

    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-amber-200/90 mb-1">Nhập kinh văn / chương truyện cần ngâm tụng:</label>
            <textarea id="tts-text" rows="5" placeholder="Nhập văn bản tại đây..." class="w-full p-3 rounded-xl border border-amber-600/50 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/75 text-amber-100 placeholder-amber-700/70 shadow-inner" required></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Chọn Chất Giọng Đa Dạng -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Chọn Chất Giọng Đọc:</label>
                <select id="voice-preset" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none" onchange="updateVoiceSettings()">
                    <option value="hoaimy_soft">🌸 Nữ - Dịu Dàng Truyền Cảm (Mặc Định)</option>
                    <option value="hoaimy_deep">🌹 Nữ - Trầm Mị / Thanh Nhã</option>
                    <option value="namminh_deep">🧘‍♂️ Nam - Trầm Ấm / Lão Tôn Chân Nhân</option>
                    <option value="namminh_hero">⚔ Nam - Uy Nghi / Khí Phách</option>
                    <option value="baby_cute">👶 Giọng Em Bé / Đồng Tử</option>
                    <option value="adam_style">🎙 Giọng Nam Tây Phương (Adam Style - Tiếng Anh)</option>
                </select>
            </div>

            <!-- Tùy Chỉnh Tốc Độ -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Tốc Độ Đọc:</label>
                <select id="rate-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <option value="-15%">Chậm Rãi (-15%)</option>
                    <option value="+0%" selected>Bình Thường (0%)</option>
                    <option value="+15%">Nhanh (+15%)</option>
                </select>
            </div>
        </div>

        <button onclick="speakText()" id="speak-btn" class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-black font-extrabold py-3.5 rounded-xl shadow-2xl transition flex items-center justify-center space-x-2 text-sm">
            <i class="fa-solid fa-volume-high"></i>
            <span>Khai Khẩu Ngâm Tụng (Phát Âm Thanh)</span>
        </button>
    </div>

    <!-- Trình Phát Âm Thanh -->
    <div id="tts-audio-container" class="hidden text-center space-y-3 pt-4 border-t border-amber-800/60">
        <p class="text-xs font-bold text-amber-300 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-circle-play text-emerald-400"></i>
            <span>Âm Thanh Đã Được Khai Khẩu Mượt Ma!</span>
        </p>
        <audio id="tts-audio-player" controls class="w-full max-w-md mx-auto accent-amber-500 rounded-lg"></audio>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let selectedVoice = "vi-VN-HoaiMyNeural";
    let selectedPitch = "+0Hz";

    function updateVoiceSettings() {
        const preset = document.getElementById('voice-preset').value;
        
        if (preset === 'hoaimy_soft') {
            selectedVoice = "vi-VN-HoaiMyNeural";
            selectedPitch = "+0Hz";
        } else if (preset === 'hoaimy_deep') {
            selectedVoice = "vi-VN-HoaiMyNeural";
            selectedPitch = "-6Hz"; // Hạ cao độ tạo giọng nữ trầm mị
        } else if (preset === 'namminh_deep') {
            selectedVoice = "vi-VN-NamMinhNeural";
            selectedPitch = "-8Hz"; // Hạ cao độ sâu tạo giọng nam trầm lão tôn
        } else if (preset === 'namminh_hero') {
            selectedVoice = "vi-VN-NamMinhNeural";
            selectedPitch = "+2Hz";
        } else if (preset === 'baby_cute') {
            selectedVoice = "vi-VN-HoaiMyNeural";
            selectedPitch = "+12Hz"; // Tăng cao độ cao tạo giọng em bé/đồng tử
        } else if (preset === 'adam_style') {
            selectedVoice = "en-US-ChristopherNeural"; // Giọng nam trầm chuẩn Adam
            selectedPitch = "-2Hz";
        }
    }

    async function speakText() {
        const text = document.getElementById('tts-text').value.trim();
        const rate = document.getElementById('rate-select').value;
        const btn = document.getElementById('speak-btn');
        const container = document.getElementById('tts-audio-container');
        const player = document.getElementById('tts-audio-player');

        if (!text) {
            alert("Xin hãy nhập văn bản cần ngâm tụng!");
            return;
        }

        btn.innerText = "⏳ Đang khai khẩu ngâm tụng, xin chờ chốc lát...";
        btn.disabled = true;

        try {
            const response = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text, 
                    voice: selectedVoice, 
                    rate: rate, 
                    pitch: selectedPitch 
                })
            });

            const resData = await response.json();

            if (resData.success) {
                player.src = resData.audio_url;
                container.classList.remove('hidden');
                player.play();
            } else {
                alert("Lỗi khai khẩu: " + resData.error);
            }
        } catch (err) {
            alert("Lỗi kết nối Tông Môn!");
        } finally {
            btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> <span>Khai Khẩu Ngâm Tụng (Phát Âm Thanh)</span>';
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
