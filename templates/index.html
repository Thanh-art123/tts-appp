{% extends "base.html" %}
{% block title %}Nghe Giảng Kinh - Tông Môn Tu Luyện{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 relative space-y-6">
    <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/40 pb-3 flex items-center space-x-2">
        <i class="fa-solid fa-scroll text-amber-500"></i>
        <span>Chuyển Văn Bản Thành Giọng Đọc Thần Âm (100% Không Lỗi Mạng)</span>
    </h2>

    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-amber-200/90 mb-1">Khẩu quyết văn bản cần ngưng tụ:</label>
            <textarea id="tts-text" rows="4" placeholder="Nhập nội dung cần đọc tại đây..." class="w-full p-3 rounded-xl border border-amber-600/50 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/75 text-amber-100 placeholder-amber-700/70 shadow-inner" required>Một khoảng lặng kéo dài. Cuối cùng, giọng nói kia chỉ để lại hai chữ: Tạm biệt.</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- Chọn Giọng Đọc -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Chọn Giọng Đọc:</label>
                <select id="voice-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <!-- Danh sách giọng tiếng Việt trên máy sẽ tự động hiển thị -->
                </select>
            </div>

            <!-- Tốc độ đọc (0.8x đến 3.5x) -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Tốc độ đọc:</span>
                    <span id="rate-val" class="font-bold text-amber-400">1.0x</span>
                </div>
                <input type="range" id="rate-range" min="0.8" max="3.5" step="0.1" value="1.0" oninput="updateRate(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
                <div class="flex justify-between text-[10px] text-amber-400/60 mt-0.5">
                    <span>0.8x</span>
                    <span>3.5x</span>
                </div>
            </div>

            <!-- Cao độ Hz (-50 đến 100 tương ứng 0.5 đến 2.0) -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Cao độ Hz:</span>
                    <span id="pitch-val" class="font-bold text-amber-400">0Hz</span>
                </div>
                <input type="range" id="pitch-range" min="-50" max="100" step="1" value="0" oninput="updatePitch(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
                <div class="flex justify-between text-[10px] text-amber-400/60 mt-0.5">
                    <span>-50Hz</span>
                    <span>100Hz</span>
                </div>
            </div>
        </div>

        <!-- CÁC NÚT ĐIỀU KHIỂN TINH GỌN -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
            <button onclick="toggleSpeech()" id="toggle-btn" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-play" id="play-icon"></i>
                <span id="play-text">Khai Khẩu Ngâm Tụng / Phát</span>
            </button>
            <button onclick="stopSpeech()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-stop"></i>
                <span>Dừng Lại</span>
            </button>
            <button onclick="downloadTextFile()" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-download"></i>
                <span>Tải Bản Khẩu Quyết (TXT)</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let synth = window.speechSynthesis;
    let voices = [];
    let currentUtterance = null;

    function populateVoices() {
        voices = synth.getVoices().filter(v => v.lang.includes('vi') || v.lang.includes('VN') || v.lang.includes('en'));
        const voiceSelect = document.getElementById('voice-select');
        voiceSelect.innerHTML = '';
        
        if (voices.length === 0) {
            voices = synth.getVoices();
        }

        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${voice.name} (${voice.lang})`;
            voiceSelect.appendChild(option);
        });
    }

    populateVoices();
    if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = populateVoices;
    }

    function updateRate(val) {
        document.getElementById('rate-val').innerText = parseFloat(val).toFixed(1) + "x";
        if (currentUtterance && synth.speaking) {
            // Cập nhật tốc độ real-time nếu đang đọc
            synth.pause();
            currentUtterance.rate = parseFloat(val);
            synth.resume();
        }
    }

    function updatePitch(val) {
        document.getElementById('pitch-val').innerText = (val > 0 ? "+" : "") + val + "Hz";
    }

    function toggleSpeech() {
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');

        if (synth.speaking && !synth.paused) {
            synth.pause();
            playIcon.className = "fa-solid fa-play";
            playText.innerText = "Phát Tiếp";
            return;
        }

        if (synth.paused) {
            synth.resume();
            playIcon.className = "fa-solid fa-pause";
            playText.innerText = "Tạm Dừng";
            return;
        }

        const text = document.getElementById('tts-text').value.trim();
        if (!text) {
            alert("Xin hãy nhập nội dung cần đọc!");
            return;
        }

        synth.cancel();

        currentUtterance = new SpeechSynthesisUtterance(text);
        const voiceIndex = document.getElementById('voice-select').value;
        if (voices[voiceIndex]) {
            currentUtterance.voice = voices[voiceIndex];
        }

        currentUtterance.rate = parseFloat(document.getElementById('rate-range').value);
        
        // Quy đổi Hz (-50 đến 100) sang hệ số pitch của trình duyệt (0.5 đến 2.0)
        let hzVal = parseInt(document.getElementById('pitch-range').value);
        let pitchFactor = 1.0 + (hzVal / 100.0);
        currentUtterance.pitch = Math.max(0.5, Math.min(2.0, pitchFactor));

        currentUtterance.onend = function() {
            playIcon.className = "fa-solid fa-play";
            playText.innerText = "Khai Khẩu Ngâm Tụng / Phát";
        };

        synth.speak(currentUtterance);
        playIcon.className = "fa-solid fa-pause";
        playText.innerText = "Tạm Dừng";
    }

    function stopSpeech() {
        synth.cancel();
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');
        playIcon.className = "fa-solid fa-play";
        playText.innerText = "Khai Khẩu Ngâm Tụng / Phát";
    }

    function downloadTextFile() {
        const text = document.getElementById('tts-text').value.trim();
        if (!text) {
            alert("Không có nội dung để tải!");
            return;
        }
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'khau_quyet_tu_tien.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>
{% endblock %}
