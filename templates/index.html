{% extends "base.html" %}
{% block title %}Nghe Giảng Kinh - Tông Môn Tu Luyện{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 relative space-y-6">
    <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/40 pb-3 flex items-center space-x-2">
        <i class="fa-solid fa-scroll text-amber-500"></i>
        <span>Chuyển Văn Bản Thành Giọng Đọc Thần Âm</span>
    </h2>

    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-amber-200/90 mb-1">Khẩu quyết văn bản cần ngưng tụ:</label>
            <textarea id="tts-text" rows="4" placeholder="Nhập nội dung cần đọc tại đây..." class="w-full p-3 rounded-xl border border-amber-600/50 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/75 text-amber-100 placeholder-amber-700/70 shadow-inner" required>Một khoảng lặng kéo dài. Cuối cùng, giọng nói kia chỉ để lại hai chữ: Tạm biệt.</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Chọn Giọng Đọc -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Chọn Giọng Đọc:</label>
                <select id="voice-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <option value="">Đang nạp linh âm...</option>
                </select>
            </div>

            <!-- Tốc độ đọc (0.8x đến 3.5x) - Thay đổi real-time ngay lúc nghe -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Tốc độ đọc:</span>
                    <span id="rate-val" class="font-bold text-amber-400">1.0x</span>
                </div>
                <input type="range" id="rate-range" min="0.8" max="3.5" step="0.1" value="1.0" oninput="changeRateRealTime(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
            </div>
        </div>

        <!-- HIỂN THỊ THỜI LƯỢNG ÂM THANH -->
        <div class="flex justify-between items-center text-xs text-amber-300 px-1 bg-black/40 p-2 rounded-lg border border-amber-800/40">
            <span>⏱ Thời lượng ước tính: <strong id="duration-display" class="text-amber-400">00:00</strong></span>
            <span>Trạng thái: <strong id="status-display" class="text-emerald-400">Sẵn sàng</strong></span>
        </div>

        <!-- CÁC NÚT ĐIỀU KHIỂN GỌN GÀNG TRÊN 1 HÀNG DUY NHẤT -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
            <button onclick="togglePlayStop()" id="toggle-play-btn" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-play" id="main-icon"></i>
                <span id="main-text">Phát Âm Thanh (1 Click)</span>
            </button>
            <button onclick="downloadAudioMP3()" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-download"></i>
                <span>Tải Nhạc (MP3)</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let synth = window.speechSynthesis;
    let currentUtterance = null;

    function populateVoices() {
        const voiceSelect = document.getElementById('voice-select');
        if (!voiceSelect) return;

        let voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        let viVoices = voices.filter(v => v.lang.includes('vi') || v.lang.includes('VN'));
        if (viVoices.length > 0) {
            viVoices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voices.indexOf(voice);
                option.textContent = voice.name.includes('An') ? `🎙 Microsoft An (${voice.lang})` : voice.name.includes('Nam') ? `👨 ${voice.name}` : ` VN: ${voice.name}`;
                voiceSelect.appendChild(option);
            });
        } else {
            voices.forEach((voice, index) => {
                const option = document.createElement('option');

                option.textContent = `${
