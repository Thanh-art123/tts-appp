{% extends "base.html" %}
{% block title %}Nghe Giảng Kinh - Tông Môn Tu Luyện{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 relative space-y-6">
    <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/40 pb-3 flex items-center space-x-2">
        <i class="fa-solid fa-scroll text-amber-500"></i>
        <span>Chuyển Văn Bản Thành Giọng Đọc Thần Âm</span>
    </h2>

    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-amber-200/90 mb-1">Khẩu quyết văn bản cần ngưng tụ:</label>
            <textarea id="tts-text" rows="4" placeholder="Nhập nội dung cần đọc tại đây..." class="w-full p-3 rounded-xl border border-amber-600/50 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/75 text-amber-100 placeholder-amber-700/70 shadow-inner" required>Một khoảng lặng kéo dài. Cuối cùng, giọng nói kia chỉ để lại hai chữ: Tạm biệt.</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Chọn Giọng Đọc -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Chọn Giọng Đọc:</label>
                <select id="voice-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <option value="vi-VN-HoaiMyNeural">🎙 Giọng Nữ — Hoài My (Thần Âm AI)</option>
                    <option value="vi-VN-NamMinhNeural">👨 Giọng Nam — Nam Minh (Thần Âm AI)</option>
                </select>
            </div>

            <!-- Tốc độ đọc (0.8x đến 3.5x) - Thay đổi real-time ngay lúc nghe -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Tốc độ đọc:</span>
                    <span id="rate-val" class="font-bold text-amber-400">1.0x</span>
                </div>
                <input type="range" id="rate-range" min="0.8" max="3.5" step="0.1" value="1.0" oninput="changeRateRealTime(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
            </div>
        </div>

        <!-- HIỂN THỊ THỜI LƯỢNG ÂM THANH -->
        <div class="flex justify-between items-center text-xs text-amber-300 px-1 bg-black/40 p-2 rounded-lg border border-amber-800/40">
            <span>⏱ Thời lượng ước tính: <strong id="duration-display" class="text-amber-400">00:00</strong></span>
            <span>Trạng thái: <strong id="status-display" class="text-emerald-400">Sẵn sàng</strong></span>
        </div>

        <!-- CÁC NÚT ĐIỀU KHIỂN GỌN GÀNG TRÊN 1 HÀNG DUY NHẤT -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
            <button onclick="togglePlayStop()" id="toggle-play-btn" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-play" id="main-icon"></i>
                <span id="main-text">Phát Âm Thanh (1 Click)</span>
            </button>
            <button onclick="downloadAudioMP3()" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-download"></i>
                <span>Tải Nhạc (MP3)</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // ===== GIỌNG ĐỌC THẦN ÂM TỪ MÁY CHỦ (edge-tts) =====
    // Âm thanh tạo trên server rồi phát bằng thẻ audio -> Android/app/WebView đều nghe được.
    const TT = {
        audio: new Audio(),
        chunks: [], idx: 0, gen: 0,
        state: 'idle', // idle | playing | paused
        sig: '', blobs: new Map(), urls: new Map()
    };
    TT.audio.preload = 'auto';

    const statusEl = () => document.getElementById('status-display');
    function setStatus(txt, cls) {
        const el = statusEl();
        if (el) { el.innerText = txt; el.className = cls || 'text-emerald-400'; }
    }
    function setMainUI(mode) {
        const icon = document.getElementById('main-icon');
        const text = document.getElementById('main-text');
        if (mode === 'playing') { icon.className = 'fa-solid fa-pause'; text.innerText = 'Tạm Dừng'; }
        else if (mode === 'paused') { icon.className = 'fa-solid fa-play'; text.innerText = 'Tiếp Tục Đọc'; }
        else { icon.className = 'fa-solid fa-play'; text.innerText = 'Phát Âm Thanh (1 Click)'; }
    }
    function currentRate() { return parseFloat(document.getElementById('rate-range').value) || 1; }

    function chunkText(text, maxLen) {
        maxLen = maxLen || 900;
        const parts = text.replace(/\s+/g, ' ').match(/[^.!?…]+[.!?…]*["”’']?\s*/g) || [text];
        const out = []; let cur = '';
        for (const p of parts) {
            if (cur && (cur + p).length > maxLen) { out.push(cur.trim()); cur = p; }
            else cur += p;
            while (cur.length > maxLen) { out.push(cur.slice(0, maxLen).trim()); cur = cur.slice(maxLen); }
        }
        if (cur.trim()) out.push(cur.trim());
        return out.filter(Boolean);
    }

    async function fetchChunkBlob(i) {
        if (TT.blobs.has(i)) return TT.blobs.get(i);
        const res = await fetch('/api/tts', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: TT.chunks[i], voice: document.getElementById('voice-select').value })
        });
        if (!res.ok) throw new Error('tts fail');
        const blob = await res.blob();
        TT.blobs.set(i, blob);
        return blob;
    }
    function chunkURL(i) {
        if (!TT.urls.has(i)) TT.urls.set(i, URL.createObjectURL(TT.blobs.get(i)));
        return TT.urls.get(i);
    }

    async function playLoop(gen) {
        while (TT.idx < TT.chunks.length) {
            if (gen !== TT.gen) return;
            setStatus(`Đang tạo âm thanh đoạn ${TT.idx + 1}/${TT.chunks.length}...`, 'text-amber-400');
            try { await fetchChunkBlob(TT.idx); }
            catch (e) { fallbackSpeak(); return; }
            if (gen !== TT.gen) return;
            TT.audio.src = chunkURL(TT.idx);
            TT.audio.playbackRate = currentRate();
            setStatus(`Đang đọc đoạn ${TT.idx + 1}/${TT.chunks.length}`, 'text-emerald-400 font-bold');
            TT.state = 'playing'; setMainUI('playing');
            try { await TT.audio.play(); } catch (e) {}
            await new Promise(res => { TT._wake = res; TT.audio.onended = res; TT.audio.onerror = res; });
            if (gen !== TT.gen) return;
            TT.idx++;
        }
        TT.state = 'idle'; setMainUI('idle');
        setStatus('Hoàn thành', 'text-emerald-400');
    }

    function fallbackSpeak() {
        // Phương án dự phòng: giọng máy của trình duyệt (nếu máy chủ bận)
        const synth = window.speechSynthesis;
        const text = document.getElementById('tts-text').value.trim();
        TT.state = 'idle'; setMainUI('idle');
        if (!synth || !text) { setStatus('Máy chủ giọng đọc đang bận, thử lại sau giây lát.', 'text-red-400'); return; }
        setStatus('Đang đọc bằng giọng dự phòng của máy...', 'text-amber-400');
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const vi = synth.getVoices().find(v => (v.lang || '').toLowerCase().includes('vi'));
        if (vi) u.voice = vi;
        u.rate = Math.min(currentRate(), 2);
        u.onend = () => setStatus('Hoàn thành', 'text-emerald-400');
        synth.speak(u);
    }

    function togglePlayStop() {
        if (TT.state === 'playing') {
            TT.audio.pause();
            TT.state = 'paused'; setMainUI('paused');
            setStatus('Đã tạm dừng', 'text-amber-400');
            return;
        }
        if (TT.state === 'paused') {
            TT.state = 'playing'; setMainUI('playing');
            TT.audio.playbackRate = currentRate();
            TT.audio.play().catch(() => {});
            setStatus(`Đang đọc đoạn ${TT.idx + 1}/${TT.chunks.length}`, 'text-emerald-400 font-bold');
            return;
        }
        const text = document.getElementById('tts-text').value.trim();
        if (!text) { alert('Xin hãy nhập nội dung cần đọc!'); return; }
        const sig = text + '|' + document.getElementById('voice-select').value;
        if (sig !== TT.sig) {
            TT.sig = sig;
            TT.chunks = chunkText(text);
            TT.blobs.clear();
            TT.urls.forEach(u => URL.revokeObjectURL(u)); TT.urls.clear();
        }
        TT.idx = 0;
        TT.gen++;
        playLoop(TT.gen);
    }

    function changeRateRealTime(val) {
        document.getElementById('rate-val').innerText = parseFloat(val).toFixed(1) + 'x';
        updateDuration();
        if (TT.state === 'playing' || TT.state === 'paused') TT.audio.playbackRate = parseFloat(val);
    }

    function updateDuration() {
        const textEl = document.getElementById('tts-text');
        const rateEl = document.getElementById('rate-range');
        const durationEl = document.getElementById('duration-display');
        if (!textEl || !rateEl || !durationEl) return;
        const text = textEl.value.trim();
        const rate = parseFloat(rateEl.value);
        const words = text ? text.split(/\s+/).length : 0;
        let seconds = (words / 150) * 60 / rate;
        durationEl.innerText = `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${Math.floor(seconds % 60).toString().padStart(2, '0')}`;
    }
    const ttsTextEl = document.getElementById('tts-text');
    if (ttsTextEl) { ttsTextEl.addEventListener('input', updateDuration); updateDuration(); }
    document.getElementById('voice-select').addEventListener('change', () => { TT.sig = ''; });

    async function downloadAudioMP3() {
        const text = document.getElementById('tts-text').value.trim();
        if (!text) { alert('Không có nội dung để tải!'); return; }
        const sig = text + '|' + document.getElementById('voice-select').value;
        if (sig !== TT.sig) {
            TT.sig = sig; TT.chunks = chunkText(text);
            TT.blobs.clear(); TT.urls.forEach(u => URL.revokeObjectURL(u)); TT.urls.clear();
        }
        try {
            const parts = [];
            for (let i = 0; i < TT.chunks.length; i++) {
                setStatus(`Đang tạo file MP3: đoạn ${i + 1}/${TT.chunks.length}...`, 'text-amber-400');
                parts.push(await fetchChunkBlob(i));
            }
            const file = new Blob(parts, { type: 'audio/mpeg' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(file);
            a.download = 'giong-doc-than-am.mp3';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setStatus('Đã tải file MP3 thật về máy!', 'text-emerald-400');
        } catch (e) {
            setStatus('Tải MP3 thất bại — máy chủ giọng đọc đang bận.', 'text-red-400');
        }
    }
</script>
{% endblock %}
