{% extends "base.html" %}

{% block title %}Tông Môn Tu Luyện - Đọc Kinh & TTS{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 shadow-2xl border border-amber-600/50">
    <div class="flex items-center space-x-2 border-b border-amber-600/40 pb-3 mb-5">
        <i class="fa-solid fa-scroll text-amber-400 text-xl"></i>
        <h2 class="font-black text-amber-300 text-lg tracking-wider">Chuyển Văn Bản Thành Giọng Đọc Thần Âm</h2>
    </div>

    <!-- Khung nhập văn bản tu luyện -->
    <div class="mb-4">
        <label class="block text-xs font-bold text-amber-300 mb-1">Khẩu quyết văn bản cần ngưng tụ:</label>
        <textarea id="tts-text" rows="5" class="w-full bg-black/80 text-amber-100 border border-amber-500/80 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-400 shadow-inner resize-none" placeholder="Nhập hoặc dán đoạn kinh văn, truyện tiên hiệp vào đây...">Một khoảng lặng kéo dài. Cuối cùng, giọng nói kia chỉ để lại hai chữ: Tạm biệt.</textarea>
    </div>

    <!-- Chọn Giọng Đọc & Tốc Độ -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-xs font-bold text-amber-300 mb-1">Chọn Giọng Đọc Tiếng Việt:</label>
            <select id="voice-select" class="w-full bg-black/90 text-amber-200 border border-amber-500/80 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-400 shadow-inner cursor-pointer">
                <option value="google_vi">⭐ Giọng Tiếng Việt Chuẩn (Nguồn Trực Tuyến - Tối Ưu Cho Vivo & Mobile)</option>
            </select>
        </div>

        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="text-xs font-bold text-amber-300">Tốc độ đọc:</label>
                <span id="rate-value" class="text-xs font-bold text-amber-400">1.0x</span>
            </div>
            <input type="range" id="tts-rate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('rate-value').innerText = this.value + 'x'" class="w-full h-2 accent-amber-500 bg-black/80 rounded-lg cursor-pointer mt-2">
        </div>
    </div>

    <!-- Trình Phát Âm Thanh (PC & Mobile) -->
    <div class="mb-4 bg-black/60 p-3 rounded-xl border border-amber-600/60">
        <label class="block text-xs font-bold text-amber-400 mb-2">Trình Phát Âm Thanh (PC & Mobile):</label>
        <audio id="tts-audio-player" class="w-full h-10 accent-amber-500" controls></audio>
    </div>

    <!-- Trạng thái -->
    <div class="flex justify-between items-center text-xs text-amber-300/80 mb-5 bg-black/40 px-3 py-2 rounded-xl border border-amber-700/40">
        <span>⏱ Thời lượng ước tính: <strong id="est-time" class="text-amber-400">00:06</strong></span>
        <span>Trạng thái: <strong id="tts-status" class="text-emerald-400">Sẵn sàng</strong></span>
    </div>

    <!-- Nút điều khiển kết xuất âm thanh -->
    <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="prepareTTS()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm cursor-pointer">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Kết Xuất Giọng Đọc (1 Click)</span>
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let synth = window.speechSynthesis;
    let localVoices = [];

    // Nạp danh sách giọng đọc của máy tính (nếu có)
    function loadVoices() {
        if (!synth) return;
        let allVoices = synth.getVoices();
        const voiceSelect = document.getElementById('voice-select');
        if (!voiceSelect) return;

        // Lọc các giọng Tiếng Việt của hệ thống
        localVoices = allVoices.filter(v => v.lang.toLowerCase().includes('vi'));

        // Reset danh sách và giữ lại giọng chuẩn Google
        voiceSelect.innerHTML = '<option value="google_vi">⭐ Giọng Tiếng Việt Chuẩn (Nguồn Trực Tuyến - Tối Ưu Cho Vivo & Mobile)</option>';

        // Thêm các giọng hệ thống nếu máy tính/điện thoại có sẵn
        localVoices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = `local_${index}`;
            option.textContent = `💻 ${voice.name} (${voice.lang})`;
            voiceSelect.appendChild(option);
        });
    }

    if (synth) {
        synth.onvoiceschanged = loadVoices;
        setTimeout(loadVoices, 300);
    }

    function prepareTTS() {
        const text = document.getElementById('tts-text').value;
        const rate = parseFloat(document.getElementById('tts-rate').value);
        const selectedVoice = document.getElementById('voice-select').value;
        const statusEl = document.getElementById('tts-status');
        const audioPlayer = document.getElementById('tts-audio-player');

        if (!text.trim()) {
            alert("Xin hãy nhập khẩu quyết văn bản!");
            return;
        }

        statusEl.innerText = "Đang kết xuất...";
        statusEl.className = "text-amber-400 font-bold animate-pulse";

        // Nếu chọn giọng trực tuyến (hoặc trên điện thoại di động)
        if (selectedVoice === "google_vi" || !selectedVoice.startsWith("local_")) {
            if (synth && synth.speaking) synth.cancel();

            const encodedText = encodeURIComponent(text.substring(0, 300));
            const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=vi&client=tw-ob`;
            
            audioPlayer.src = audioUrl;
            audioPlayer.playbackRate = rate;

            audioPlayer.oncanplaythrough = function() {
                statusEl.innerText = "Đã sẵn sàng phát!";
                statusEl.className = "text-emerald-400 font-bold";
            };

            audioPlayer.onerror = function() {
                statusEl.innerText = "Lỗi kết nối âm thanh";
                statusEl.className = "text-red-400 font-bold";
            };

            audioPlayer.load();

            audioPlayer.play().then(() => {
                statusEl.innerText = "Đang tụng đọc...";
                statusEl.className = "text-amber-400 font-bold animate-pulse";
            }).catch(e => {
                console.log("Autoplay restricted:", e);
                statusEl.innerText = "Hãy bấm nút Play trên thanh phát!";
                statusEl.className = "text-amber-300 font-bold";
            });
        } else {
            // Nếu chọn giọng hệ thống máy tính
            if (synth.speaking) synth.cancel();

            const voiceIndex = parseInt(selectedVoice.replace("local_", ""));
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = rate;
            if (localVoices[voiceIndex]) {
                utterance.voice = localVoices[voiceIndex];
            }

            utterance.onstart = function() {
                statusEl.innerText = "Đang tụng đọc (Máy tính)...";
                statusEl.className = "text-amber-400 font-bold animate-pulse";
            };

            utterance.onend = function() {
                statusEl.innerText = "Hoàn thành";
                statusEl.className = "text-emerald-400 font-bold";
            };

            synth.speak(utterance);
        }
    }
</script>
{% endblock %}
