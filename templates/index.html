{% extends "base.html" %}
{% block title %}Nghe Giảng Kinh - Tông Môn Tu Luyện{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 relative space-y-6">
    <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/40 pb-3 flex items-center space-x-2">
        <i class="fa-solid fa-scroll text-amber-500"></i>
        <span>Giảng Kinh Điện - Giọng Đọc Tông Môn (Nam & Nữ)</span>
    </h2>

    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-amber-200/90 mb-1">Nhập kinh văn / chương truyện tu tiên cần ngâm tụng:</label>
            <textarea id="tts-text" rows="5" placeholder="Nhập khẩu quyết hoặc nội dung chương truyện tại đây..." class="w-full p-3 rounded-xl border border-amber-600/50 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/75 text-amber-100 placeholder-amber-700/70 shadow-inner" required></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Chọn Giọng Đọc -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Chọn Giọng Đọc:</label>
                <select id="voice-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <option value="vi-VN-HoaiMyNeural">👩 Hoài Mỹ (Giọng Nữ Dịu Dàng, Truyền Cảm)</option>
                    <option value="vi-VN-NamMinhNeural">👨 Nam Minh (Giọng Nam Trầm Ấm, Uy Nghi)</option>
                </select>
            </div>

            <!-- Tốc Độ Đọc -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Tốc Độ Ngâm Tụng:</label>
                <select id="rate-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <option value="-15%">Chậm Rãi (-15%)</option>
                    <option value="+0%" selected>Bình Thường (0%)</option>
                    <option value="+15%">Nhanh (+15%)</option>
                    <option value="+30%">Nhanh Vù Vù (+30%)</option>
                </select>
            </div>
        </div>

        <button onclick="speakText()" id="speak-btn" class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-black font-extrabold py-3.5 rounded-xl shadow-2xl transition flex items-center justify-center space-x-2 text-sm">
            <i class="fa-solid fa-volume-high"></i>
            <span>Khai Khẩu Ngâm Tụng (Phát Âm Thanh)</span>
        </button>
    </div>

    <!-- Trình Phát Âm Thanh Kết Quả -->
    <div id="tts-audio-container" class="hidden text-center space-y-3 pt-4 border-t border-amber-800/60">
        <p class="text-xs font-bold text-amber-300 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-circle-play text-emerald-400"></i>
            <span>Kinh Văn Đã Được Khai Khẩu Mượt Mà!</span>
        </p>
        <audio id="tts-audio-player" controls class="w-full max-w-md mx-auto accent-amber-500 rounded-lg"></audio>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function speakText() {
        const text = document.getElementById('tts-text').value.trim();
        const voice = document.getElementById('voice-select').value;
        const rate = document.getElementById('rate-select').value;
        
        const btn = document.getElementById('speak-btn');
        const container = document.getElementById('tts-audio-container');
        const player = document.getElementById('tts-audio-player');

        if (!text) {
            alert("Xin hãy nhập kinh văn cần ngâm tụng!");
            return;
        }

        btn.innerText = "⏳ Đang khai khẩu ngâm tụng, xin chờ chốc lát...";
        btn.disabled = true;

        try {
            const response = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice, rate })
            });

            const resData = await response.json();

            if (resData.success) {
                player.src = resData.audio_url;
                container.classList.remove('hidden');
                player.play();
            } else {
                alert("Lỗi khai khẩu: " + (resData.error || "Không thể phát âm thanh"));
            }
        } catch (err) {
            alert("Lỗi kết nối Tông Môn!");
        } finally {
            btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> <span>Khai Khẩu Ngâm Tụng (Phát Âm Thanh)</span>';
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
