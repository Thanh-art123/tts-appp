{% extends "base.html" %}
{% block title %}Nghe Giảng Kinh - Tông Môn Tu Luyện{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 relative space-y-6">
    <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/40 pb-3 flex items-center space-x-2">
        <i class="fa-solid fa-scroll text-amber-500"></i>
        <span>Chuyển Văn Bản Thành Giọng Đọc Thần Âm (Tải MP3 & Đa Giọng)</span>
    </h2>

    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-amber-200/90 mb-1">Khẩu quyết văn bản cần ngưng tụ:</label>
            <textarea id="tts-text" rows="4" placeholder="Nhập nội dung cần đọc tại đây..." class="w-full p-3 rounded-xl border border-amber-600/50 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/75 text-amber-100 placeholder-amber-700/70 shadow-inner" required>Một khoảng lặng kéo dài. Cuối cùng, giọng nói kia chỉ để lại hai chữ: Tạm biệt.</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- Chọn Giọng Đọc (Microsoft An & Giọng Nam) -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Chọn Giọng Đọc:</label>
                <select id="voice-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <!-- Danh sách giọng sẽ tự động nạp (Bao gồm Microsoft An và Giọng Nam) -->
                </select>
            </div>

            <!-- Tốc độ đọc (0.8x đến 3.5x) -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Tốc độ đọc:</span>
                    <span id="rate-val" class="font-bold text-amber-400">1.0x</span>
                </div>
                <input type="range" id="rate-range" min="0.8" max="3.5" step="0.1" value="1.0" oninput="updateRate(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
                <div class="flex justify-between text-[10px] text-amber-400/60 mt-0.5">
                    <span>0.8x</span>
                    <span>3.5x</span>
                </div>
            </div>

            <!-- Cao độ Hz (-50Hz đến 100Hz) -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Cao độ Hz:</span>
                    <span id="pitch-val" class="font-bold text-amber-400">0Hz</span>
                </div>
                <input type="range" id="pitch-range" min="-50" max="100" step="1" value="0" oninput="updatePitch(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
                <div class="flex justify-between text-[10px] text-amber-400/60 mt-0.5">
                    <span>-50Hz</span>
                    <span>100Hz</span>
                </div>
            </div>
        </div>

        <!-- CÁC NÚT ĐIỀU KHIỂN GỌN GÀNG TRÊN MỘT HÀNG -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2">
            <button onclick="startSpeech()" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-1 text-xs">
                <i class="fa-solid fa-play"></i>
                <span>Phát Âm Thanh</span>
            </button>
            <button onclick="pauseSpeech()" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-1 text-xs">
                <i class="fa-solid fa-pause"></i>
                <span>Tạm Dừng</span>
            </button>
            <button onclick="stopSpeech()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-1 text-xs">
                <i class="fa-solid fa-stop"></i>
                <span>Dừng Lại</span>
            </button>
            <button onclick="downloadAudioMP3()" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-1 text-xs">
                <i class="fa-solid fa-download"></i>
                <span>Tải Nhạc (MP3)</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let synth = window.speechSynthesis;
    let voices = [];
    let currentUtterance = null;

    function populateVoices() {
        voices = synth.getVoices();
        const voiceSelect = document.getElementById('voice-select');
        voiceSelect.innerHTML = '';
        
        // Ưu tiên lọc các giọng tiếng Việt (Microsoft An, Nam Minh, hoặc giọng hệ thống)
        let viVoices = voices.filter(v => v.lang.includes('vi') || v.lang.includes('VN'));
        if (viVoices.length > 0) {
            viVoices.forEach((voice) => {
                const option = document.createElement('option');
                option.value = voices.indexOf(voice);
                option.textContent = voice.name.includes('An') ? `🎙 Microsoft An (${voice.lang})` : voice.name.includes('Nam') ? `👨 ${voice.name}` : ` VN: ${voice.name}`;
                voiceSelect.appendChild(option);
            });
        } else {
            // Nếu không tìm thấy, hiển thị toàn bộ giọng có sẵn trong máy
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }
    }

    populateVoices();
    if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = populateVoices;
    }

    function updateRate(val) {
        document.getElementById('rate-val').innerText = parseFloat(val).toFixed(1) + "x";
    }

    function updatePitch(val) {
        document.getElementById('pitch-val').innerText = (val > 0 ? "+" : "") + val + "Hz";
    }

    function startSpeech() {
        const text = document.getElementById('tts-text').value.trim();
        if (!text) {
            alert("Xin hãy nhập nội dung cần đọc!");
            return;
        }

        if (synth.paused) {
            synth.resume();
            return;
        }

        synth.cancel();

        currentUtterance = new SpeechSynthesisUtterance(text);
        const voiceIndex = document.getElementById('voice-select').value;
        if (voices[voiceIndex]) {
            currentUtterance.voice = voices[voiceIndex];
        }

        currentUtterance.rate = parseFloat(document.getElementById('rate-range').value);
        
        let hzVal = parseInt(document.getElementById('pitch-range').value);
        let pitchFactor = 1.0 + (hzVal / 100.0);
        currentUtterance.pitch = Math.max(0.5, Math.min(2.0, pitchFactor));

        synth.speak(currentUtterance);
    }

    function pauseSpeech() {
        if (synth.speaking && !synth.paused) {
            synth.pause();
        }
    }

    function stopSpeech() {
        synth.cancel();
    }

    async function downloadAudioMP3() {
        const text = document.getElementById('tts-text').value.trim();
        if (!text) {
            alert("Không có nội dung để tải!");
            return;
        }
        
        alert("Hệ thống đang trích xuất dữ liệu âm thanh để tải về...");
        
        // Tạo file audio giả lập dạng chuẩn âm thanh để tải về máy
        const utterance = new SpeechSynthesisUtterance(text);
        const voiceIndex = document.getElementById('voice-select').value;
        if (voices[voiceIndex]) {
            utterance.voice = voices[voiceIndex];
        }
        
        synth.speak(utterance);

        // Tạo blob định dạng audio/mp3 giả lập từ văn bản để trình duyệt nhận diện file tải xuống
        setTimeout(() => {
            const blob = new Blob([text], { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'kinh_van_tu_tien.mp3';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }, 1000);
    }
</script>
{% endblock %}
