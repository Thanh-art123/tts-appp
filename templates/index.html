{% extends "base.html" %}
{% block title %}Nghe Giảng Kinh - Tông Môn Tu Luyện{% endblock %}

{% block content %}
<div class="panel-3d rounded-2xl p-6 relative space-y-6">
    <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/40 pb-3 flex items-center space-x-2">
        <i class="fa-solid fa-scroll text-amber-500"></i>
        <span>Chuyển Văn Bản Thành Giọng Đọc Thần Âm</span>
    </h2>

    <div class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-amber-200/90 mb-1">Khẩu quyết văn bản cần ngưng tụ:</label>
            <textarea id="tts-text" rows="4" placeholder="Nhập nội dung cần đọc tại đây..." class="w-full p-3 rounded-xl border border-amber-600/50 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/75 text-amber-100 placeholder-amber-700/70 shadow-inner" required>Một khoảng lặng kéo dài. Cuối cùng, giọng nói kia chỉ để lại hai chữ: Tạm biệt.</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- Chọn Giọng Tôn Giả -->
            <div>
                <label class="block text-xs font-bold text-amber-300 mb-1">Giọng Tôn Giả (Đổi trực tiếp):</label>
                <select id="voice-select" class="w-full p-2.5 rounded-lg border border-amber-600/60 bg-black text-xs font-semibold text-amber-200 outline-none">
                    <option value="vi-VN-AnNeural" selected>🎙 Microsoft An (Nữ Dịu Dàng)</option>
                    <option value="vi-VN-HoaiMyNeural">👩 Hoài Mỹ (Nữ Thanh Thoát)</option>
                    <option value="vi-VN-NamMinhNeural">👨 Nam Minh (Giọng Nam Trầm Ấm)</option>
                </select>
            </div>

            <!-- Tốc độ đọc (0.8x đến 3.5x) - Chỉnh được trực tiếp khi đang đọc -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Tốc độ đọc:</span>
                    <span id="rate-val" class="font-bold text-amber-400">1.0x</span>
                </div>
                <input type="range" id="rate-range" min="0.8" max="3.5" step="0.1" value="1.0" oninput="updateRate(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
                <div class="flex justify-between text-[10px] text-amber-400/60 mt-0.5">
                    <span>0.8x</span>
                    <span>3.5x</span>
                </div>
            </div>

            <!-- Cao độ Hz (-50Hz đến 100Hz) -->
            <div>
                <div class="flex justify-between text-xs text-amber-200 mb-1">
                    <span class="font-bold text-amber-300">Cao độ Hz:</span>
                    <span id="pitch-val" class="font-bold text-amber-400">0Hz</span>
                </div>
                <input type="range" id="pitch-range" min="-50" max="100" step="1" value="0" oninput="updatePitchDisplay(this.value)" class="w-full h-1.5 accent-amber-500 rounded-lg cursor-pointer">
                <div class="flex justify-between text-[10px] text-amber-400/60 mt-0.5">
                    <span>-50Hz</span>
                    <span>100Hz</span>
                </div>
            </div>
        </div>

        <!-- BẢNG NÚT BẤM TINH GỌN (Chỉ có Nút Phát/Tắt, Nút Dừng, Nút Tải Nhạc) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
            <button onclick="toggleSpeech()" id="toggle-btn" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-play" id="play-icon"></i>
                <span id="play-text">Khai Khẩu Ngâm Tụng / Phát</span>
            </button>
            <button onclick="stopSpeech()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs">
                <i class="fa-solid fa-stop"></i>
                <span>Dừng Lại</span>
            </button>
            <a id="download-btn" href="#" download="kinh_van.mp3" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-black font-extrabold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-xs pointer-events-none opacity-50">
                <i class="fa-solid fa-download"></i>
                <span>Tải Nhạc (MP3)</span>
            </a>
        </div>

        <!-- Phân đoạn Audio phát ẩn bên dưới -->
        <div id="audio-player-wrapper" class="hidden">
            <audio id="tts-audio-player" controls class="w-full accent-amber-500 rounded-lg mt-2"></audio>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function updateRate(val) {
        const rateVal = parseFloat(val).toFixed(1);
        document.getElementById('rate-val').innerText = rateVal + "x";
        
        // Điều chỉnh tốc độ phát ngay lập tức real-time kể cả khi đang nghe
        const player = document.getElementById('tts-audio-player');
        if (player) {
            player.playbackRate = parseFloat(val);
        }
    }

    function updatePitchDisplay(val) {
        document.getElementById('pitch-val').innerText = (val > 0 ? "+" : "") + val + "Hz";
    }

    async function toggleSpeech() {
        const player = document.getElementById('tts-audio-player');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');

        // Nếu đang phát âm thanh thì bấm nút sẽ Tắt/Tạm dừng
        if (player.src && !player.paused) {
            player.pause();
            playIcon.className = "fa-solid fa-play";
            playText.innerText = "Phát Tiếp";
            return;
        }

        // Nếu đang tạm dừng thì tiếp tục phát
        if (player.src && player.paused && player.currentTime > 0) {
            player.play();
            playIcon.className = "fa-solid fa-pause";
            playText.innerText = "Tắt / Tạm Dừng";
            return;
        }

        // Nếu chưa tạo file âm thanh, tiến hành gọi server tổng hợp
        const text = document.getElementById('tts-text').value.trim();
        const voice = document.getElementById('voice-select').value;
        const rateVal = parseFloat(document.getElementById('rate-range').value);
        const pitchVal = document.getElementById('pitch-range').value;

        const pitch = (pitchVal > 0 ? "+" : "") + pitchVal + "Hz";
        const ratePercent = Math.round((rateVal - 1.0) * 100);
        const rate = (ratePercent >= 0 ? "+" : "") + ratePercent + "%";

        const downloadBtn = document.getElementById('download-btn');

        if (!text) {
            alert("Xin hãy nhập nội dung cần đọc!");
            return;
        }

        playText.innerText = "⏳ Đang Ngưng Tụ...";

        try {
            const response = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice, rate, pitch })
            });

            const resData = await response.json();

            if (resData.success) {
                player.src = resData.audio_url;
                player.playbackRate = rateVal; // Áp dụng tốc độ đã chọn
                
                // Mở khóa nút Tải Nhạc
                downloadBtn.href = resData.audio_url;
                downloadBtn.classList.remove('pointer-events-none', 'opacity-50');

                player.play();
                playIcon.className = "fa-solid fa-pause";
                playText.innerText = "Tắt / Tạm Dừng";
            } else {
                alert("Lỗi: " + (resData.error || "Không thể tạo âm thanh"));
                playText.innerText = "Khai Khẩu Ngâm Tụng / Phát";
            }
        } catch (err) {
            alert("Lỗi kết nối tới máy chủ!");
            playText.innerText = "Khai Khẩu Ngâm Tụng / Phát";
        }
    }

    function stopSpeech() {
        const player = document.getElementById('tts-audio-player');
        const playIcon = document.getElementById('play-icon');
        const playText = document.getElementById('play-text');

        if (player) {
            player.pause();
            player.currentTime = 0;
        }

        playIcon.className = "fa-solid fa-play";
        playText.innerText = "Khai Khẩu Ngâm Tụng / Phát";
    }
</script>
{% endblock %}
