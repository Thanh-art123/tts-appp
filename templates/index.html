<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tông Môn Tu Luyện - Tiên Cảnh Tàng Kinh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0c0a09;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* KHÔNG GIANG TIÊN CẢNH 3D PARALLAX */
        .xianxia-world {
            position: relative;
            min-height: 100vh;
            background: url('https://image.pollinations.ai/prompt/xianxia%20golden%20temples%20monk%20cultivation%20mystic?width=1920&height=1080&nologo=true') center/cover no-repeat fixed;
            perspective: 1000px;
        }

        /* Lớp sương mù linh khí di chuyển */
        .mist-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(217, 119, 6, 0.15) 0%, rgba(12, 10, 9, 0.85) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Thẻ Nổi Khối Tương Tác 3D */
        .card-3d-panel {
            transform-style: preserve-3d;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            background: rgba(20, 16, 13, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(245, 158, 11, 0.1);
        }

        .card-3d-panel:hover {
            transform: translateY(-8px) rotateX(2deg) rotateY(-2deg) scale(1.01);
            border-color: rgba(251, 191, 36, 0.7);
            box-shadow: 0 25px 45px rgba(245, 158, 11, 0.25), inset 0 0 25px rgba(245, 158, 11, 0.2);
        }

        /* Nút Điều Hướng Các Điện Các Tu Tiên */
        .sect-building-btn {
            background: linear-gradient(135deg, rgba(69, 26, 3, 0.9), rgba(120, 53, 15, 0.9));
            border: 1px solid #f59e0b;
            color: #fef3c7;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        .sect-building-btn.active, .sect-building-btn:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
            transform: translateY(-3px) scale(1.03);
        }

        .sub-element-btn.active-sub {
            background-color: #b45309;
            color: #ffffff;
            border-color: #fef3c7;
        }
    </style>
</head>
<body class="text-amber-100 xianxia-world flex flex-col justify-between">

    <div class="mist-overlay"></div>

    <!-- HEADER & NHẠC NỀN YOUTUBE AUDIO LIBRARY (3 BÀI LẶP LẠI) -->
    <header class="relative z-10 bg-black/80 text-amber-200 border-b border-amber-600/40 backdrop-blur-md sticky top-0 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-dharmachakra text-amber-500 text-3xl animate-spin" style="animation-duration: 15s;"></i>
                <div>
                    <h1 class="text-xl md:text-2xl font-black tracking-widest text-amber-400 drop-shadow-md">TÔNG MÔN TU LUYỆN</h1>
                    <p class="text-[10px] text-amber-200/70">Tiên Cảnh Diệu Âm • Tàn Kinh Vô Lượng</p>
                </div>
            </div>
            
            <!-- Trình Phát Nhạc Nhạc Phim Kịch Tính Lặp Lại -->
            <div class="flex items-center space-x-3 bg-amber-950/80 px-4 py-2 rounded-full border border-amber-500/50 shadow-lg">
                <i class="fa-solid fa-compact-disc text-amber-400 animate-spin" id="disc-icon" style="animation-play-state: paused;"></i>
                <div class="text-left hidden sm:block">
                    <p class="text-[10px] text-amber-400/80 uppercase font-bold">Thần Âm Tông Môn:</p>
                    <p id="song-title" class="text-xs font-bold text-amber-100 w-32 truncate">Videodrome</p>
                </div>
                <button onclick="toggleMusic()" id="music-btn" class="text-xs bg-amber-600 hover:bg-amber-500 text-black font-extrabold px-3 py-1.5 rounded-full transition shadow">
                    ▶ Phát Nhạc
                </button>
            </div>
        </div>
    </header>

    <!-- NAVIGATION TABS DẠNG ĐIỆN CÁC TIÊN CẢNH -->
    <div class="relative z-10 max-w-7xl mx-auto px-4 mt-6 w-full">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
            <button onclick="switchTab('nghe-giang')" id="tab-nghe-giang" class="sect-building-btn active text-xs md:text-sm font-bold py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 shadow-xl">
                <i class="fa-solid fa-scroll text-amber-400"></i>
                <span>Nghe Giảng Kinh</span>
            </button>
            <button onclick="switchTab('tang-kinh-cac')" id="tab-tang-kinh-cac" class="sect-building-btn text-xs md:text-sm font-bold py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 shadow-xl">
                <i class="fa-solid fa-book-journal-whills text-amber-400"></i>
                <span>Tàng Kinh Các</span>
            </button>
            <button onclick="switchTab('tao-cong-phap')" id="tab-tao-cong-phap" class="sect-building-btn text-xs md:text-sm font-bold py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 shadow-xl">
                <i class="fa-solid fa-hammer text-amber-400"></i>
                <span>Chế Tạp Các (Tải Lên)</span>
            </button>
            <button onclick="switchTab('dong-phu')" id="tab-dong-phu" class="sect-building-btn text-xs md:text-sm font-bold py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 shadow-xl">
                <i class="fa-solid fa-torii-gate text-amber-400"></i>
                <span>Động Phủ</span>
            </button>
            <button onclick="switchTab('bi-canh')" id="tab-bi-canh" class="sect-building-btn text-xs md:text-sm font-bold py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 shadow-xl col-span-2 md:col-span-1">
                <i class="fa-solid fa-gem text-amber-400"></i>
                <span>Bí Cảnh Tu Luyện</span>
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 my-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">

            <!-- 1. NGHE GIẢNG KINH (TTS) -->
            <div id="sec-nghe-giang" class="tab-content card-3d-panel rounded-2xl p-6 relative">
                <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/30 pb-3 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-feather-pointed"></i>
                    <span>Chuyển Văn Bản Thành Giọng Đọc Thần Âm</span>
                </h2>

                <form id="tts-form" onsubmit="handleTTS(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-amber-200/80 mb-1">Khẩu quyết văn bản cần ngưng tụ:</label>
                        <textarea id="tts-text" rows="5" placeholder="Nhập khẩu quyết hoặc nội dung truyện cần đọc vào đây..." class="w-full p-3 rounded-xl border border-amber-600/40 focus:ring-2 focus:ring-amber-500 focus:outline-none bg-black/60 text-amber-100 placeholder-amber-700/60 shadow-inner" required></textarea>
                    </div>

                    <!-- THÔNG SỐ CÀI ĐẶT -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-amber-950/40 p-4 rounded-xl border border-amber-700/40">
                        <div>
                            <label class="block text-xs font-bold text-amber-300 mb-1">Giọng Tôn Giả:</label>
                            <select id="tts-voice" class="w-full p-2.5 rounded-lg border border-amber-600/50 bg-black text-xs font-semibold text-amber-200 outline-none">
                                <option value="vi-VN-HoaiMyNeural">Hoài Mỹ (Nữ - Thanh thoát)</option>
                                <option value="vi-VN-NamMinhNeural">Nam Minh (Nam - Uy nghiêm)</option>
                            </select>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs font-bold text-amber-300 mb-1">
                                <span>Tốc độ đọc:</span>
                                <span id="rate-val" class="text-amber-400">0%</span>
                            </div>
                            <input type="range" min="-50" max="50" value="0" id="tts-rate" oninput="document.getElementById('rate-val').innerText = this.value + '%'" class="w-full accent-amber-500 mt-2">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs font-bold text-amber-300 mb-1">
                                <span>Cao độ (Hz: -200 đến 200):</span>
                                <span id="pitch-val" class="text-amber-400">0Hz</span>
                            </div>
                            <input type="range" min="-200" max="200" value="0" id="tts-pitch" oninput="document.getElementById('pitch-val').innerText = this.value + 'Hz'" class="w-full accent-amber-500 mt-2">
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-black font-extrabold py-3.5 rounded-xl shadow-2xl transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>Vận Công Ngưng Tụ Âm Thanh</span>
                    </button>
                </form>

                <!-- KHU VỰC PHÁT AUDIO & TẢI VỀ -->
                <div id="audio-result-container" class="mt-6 hidden p-4 bg-amber-950/80 border border-amber-500/60 rounded-xl shadow-2xl">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-xs font-bold text-amber-300 flex items-center space-x-2">
                            <i class="fa-solid fa-circle-check text-emerald-400"></i>
                            <span>Linh Âm Đã Tụ Thành Công:</span>
                        </p>
                        <a id="download-btn" href="#" download="tu-tien-audio.mp3" class="text-xs bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-3 py-1.5 rounded-lg shadow transition flex items-center space-x-1">
                            <i class="fa-solid fa-download"></i>
                            <span>Tải Về Động Phủ</span>
                        </a>
                    </div>
                    <audio id="audio-player" controls class="w-full rounded-lg accent-amber-500"></audio>
                </div>
            </div>

            <!-- 2. TÀNG KINH CÁC (10 THUỘC TÍNH) -->
            <div id="sec-tang-kinh-cac" class="tab-content card-3d-panel hidden rounded-2xl p-6">
                <h2 class="text-lg font-bold text-amber-400 border-b border-amber-600/30 pb-3 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa
