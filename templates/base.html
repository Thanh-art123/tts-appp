<script>
    // Danh sách các file nhạc đúng chuẩn từ thư mục static/music/ trên GitHub của bạn
    const playlist = [
        { 
            title: "Burlesque", 
            src: "/static/music/Burlesque - National Sweetheart.mp3" 
        },
        { 
            title: "The Joint is Jumpin", 
            src: "/static/music/The Joint is Jumpin - Joel Cummins.mp3" 
        },
        { 
            title: "Videodrome", 
            src: "/static/music/Videodrome - National Sweetheart.mp3" 
        }
    ];

    let currentTrack = 0;
    let bgAudio = new Audio(playlist[currentTrack].src);
    bgAudio.volume = 0.3;

    bgAudio.onended = function() {
        currentTrack = (currentTrack + 1) % playlist.length;
        bgAudio.src = playlist[currentTrack].src;
        document.getElementById('song-title').innerText = playlist[currentTrack].title;
        bgAudio.play();
    };

    function changeMusicVolume(val) {
        if (bgAudio) {
            bgAudio.volume = parseFloat(val);
        }
    }

    function loadCustomMusic(event) {
        const file = event.target.files[0];
        if (file) {
            const customUrl = URL.createObjectURL(file);
            bgAudio.pause();
            bgAudio = new Audio(customUrl);
            bgAudio.volume = parseFloat(document.getElementById('bg-volume').value);
            bgAudio.loop = true;
            document.getElementById('song-title').innerText = file.name;
            bgAudio.play();
            
            const btn = document.getElementById('music-btn');
            const disc = document.getElementById('disc-icon');
            btn.innerText = "⏸ Dừng";
            btn.classList.replace('bg-amber-500', 'bg-red-600');
            if (disc) disc.style.animationPlayState = 'running';
        }
    }

    function toggleMusic() {
        const btn = document.getElementById('music-btn');
        const disc = document.getElementById('disc-icon');
        if (bgAudio.paused) {
            bgAudio.play();
            btn.innerText = "⏸ Dừng";
            btn.classList.replace('bg-amber-500', 'bg-red-600');
            if (disc) disc.style.animationPlayState = 'running';
        } else {
            bgAudio.pause();
            btn.innerText = "▶ Phát";
            btn.classList.replace('bg-red-600', 'bg-amber-500');
            if (disc) disc.style.animationPlayState = 'paused';
        }
    }
</script>
